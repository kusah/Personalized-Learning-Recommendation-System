<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="dashboard-container">

    <h1>👤 Student Profile</h1>

    <h2 class="welcome-text">
        Welcome, {{ student[0] }} 👋
    </h2>
    <div class="profile-buttons">

    <a href="/">
        <button class="back-btn">
            ← Back to Home
        </button>
    </a>

    <a href="/logout">
        <button class="logout-btn">
            🚪 Logout
        </button>
    </a>

</div>
    </a>

    <div class="cards">

        <div class="card">
            <h3>Name</h3>
            <p>{{ student[0] }}</p>
        </div>

        <div class="card">
            <h3>Email</h3>
            <p>{{ student[1] }}</p>
        </div>

        <div class="card">
            <h3>Career Goal</h3>
            <p>{{ student[2] }}</p>
        </div>

        <div class="card">
            <h3>Roadmaps Generated</h3>
            <p>{{ roadmap_count }}</p>
        </div>

        <div class="card">
            <h3>Completed Courses</h3>
            <p>{{ completed_count }}</p>
        </div>

        <div class="card">
            <h3>Pending Courses</h3>
            <p>{{ pending_count }}</p>
        </div>
        <div class="card">
            <h3>Progress</h3>
            <p>{{ progress }}%</p>
        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<h1>Student Registration</h1>

<form method="POST">

    <input
        type="text"
        name="student_name"
        placeholder="Name"
        required>

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <br><br>

    <select name="career_goal">

        <option>Data Analyst</option>
        <option>Data Scientist</option>
        <option>Software Developer</option>
        <option>Business Analyst</option>
        <option>Machine Learning Engineer</option>

    </select>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>

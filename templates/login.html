<html>
<head>
    <title>Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<div class="auth-container">
    <a href="/" class="back-home">
        ← Back to Home
    </a>
    <div class="auth-card">
        <div class="auth-logo">
            🚀 LearnAI
        </div>
        <h1>Welcome Back 👋</h1>
        <p>
            Login to continue your learning journey
        </p>
        <form method="POST">
            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >
            <button type="submit">
                Login
            </button>
        </form>
        <div class="auth-footer">
            Don't have an account?
            <a href="/register">
                Sign Up
            </a>
        </div>
    </div>
</div>
</body>
</html>
